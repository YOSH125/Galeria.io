<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas de Shucos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #333;
        }
        
        .btn-descargar {
            background: #43a047;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-descargar:hover {
            background: #388e3c;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }
        
        thead {
            background: #43a047;
            color: white;
        }
        
        th, td {
            padding: 15px 20px;
            text-align: left;
            border: 1px solid #ddd;
        }
        
        th {
            font-weight: bold;
        }
        
        td:nth-child(2),
        td:nth-child(3),
        td:nth-child(4),
        th:nth-child(2),
        th:nth-child(3),
        th:nth-child(4) {
            text-align: right;
        }
        
        tbody tr:nth-child(odd) {
            background: #f5f5f5;
        }
        
        tbody tr:hover {
            background: #e8f5e9;
        }
        
        .totales {
            background: #c8e6c9 !important;
            font-weight: bold;
        }
        
        .totales td {
            color: #2e7d32;
            font-weight: bold;
        }
        
        .estadisticas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .stat-card {
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid;
        }
        
        .stat-card.blue {
            background: #e3f2fd;
            border-color: #2196f3;
        }
        
        .stat-card.green {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .stat-card.purple {
            background: #f3e5f5;
            border-color: #9c27b0;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-card.blue .stat-value {
            color: #2196f3;
        }
        
        .stat-card.green .stat-value {
            color: #4caf50;
        }
        
        .stat-card.purple .stat-value {
            color: #9c27b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Ventas de Shucos</h1>
            <button class="btn-descargar" onclick="descargarExcel()">
                <span>⬇</span> Descargar Excel (XLSX)
            </button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Cantidad de Shucos (Panes)</th>
                    <th>Ventas (Q)</th>
                    <th>Precio Promedio</th>
                </tr>
            </thead>
            <tbody id="tabla-datos">
                <tr>
                    <td>Día 1</td>
                    <td>35</td>
                    <td>Q560.00</td>
                    <td>Q16.00</td>
                </tr>
                <tr>
                    <td>Día 2</td>
                    <td>50</td>
                    <td>Q730.00</td>
                    <td>Q14.60</td>
                </tr>
                <tr>
                    <td>Día 3</td>
                    <td>50</td>
                    <td>Q625.00</td>
                    <td>Q12.50</td>
                </tr>
                <tr class="totales">
                    <td>TOTALES</td>
                    <td>135</td>
                    <td>Q1915.00</td>
                    <td>Q14.19</td>
                </tr>
            </tbody>
        </table>
        
        <div class="estadisticas">
            <div class="stat-card blue">
                <div class="stat-label">Total Shucos Vendidos</div>
                <div class="stat-value">135</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">Ventas Totales</div>
                <div class="stat-value">Q1915.00</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">Precio Promedio</div>
                <div class="stat-value">Q14.19</div>
            </div>
        </div>
    </div>
    
    <script>
        // Datos para exportar
        const datos = [
            { dia: 1, cantidad: 35, ventas: 560 },
            { dia: 2, cantidad: 50, ventas: 730 },
            { dia: 3, cantidad: 50, ventas: 625 }
        ];
        
        function descargarExcel() {
            // Preparar datos para Excel
            const datosExcel = datos.map(row => ({
                'Día': `Día ${row.dia}`,
                'Cantidad de Shucos (Panes)': row.cantidad,
                'Ventas (Q)': row.ventas,
                'Precio Promedio': parseFloat((row.ventas / row.cantidad).toFixed(2))
            }));
            
            // Calcular totales
            const totalShucos = datos.reduce((sum, row) => sum + row.cantidad, 0);
            const totalVentas = datos.reduce((sum, row) => sum + row.ventas, 0);
            const precioPromedio = totalVentas / totalShucos;
            
            // Agregar fila de totales
            datosExcel.push({
                'Día': 'TOTALES',
                'Cantidad de Shucos (Panes)': totalShucos,
                'Ventas (Q)': totalVentas,
                'Precio Promedio': parseFloat(precioPromedio.toFixed(2))
            });
            
            // Crear libro de trabajo
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(datosExcel);
            
            // Ajustar ancho de columnas
            ws['!cols'] = [
                { wch: 15 },
                { wch: 28 },
                { wch: 15 },
                { wch: 18 }
            ];
            
            // Agregar hoja al libro
            XLSX.utils.book_append_sheet(wb, ws, 'Ventas Shucos');
            
            // Descargar archivo
            XLSX.writeFile(wb, 'ventas_shucos.xlsx');
        }
    </script>
</body>
</html>
